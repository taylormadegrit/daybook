<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybook Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --bg:#0a0b10;--glass:rgba(22,24,33,.72);--glass2:rgba(30,33,45,.6);--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --fg:#eceef4;--muted:#8d93a5;--a1:#8b7bff;--a2:#4fd1ff;--a3:#ff7ac6;--ok:#3ee0a0;--warn:#ffbe5c;--bad:#ff6b81;
  --grad:linear-gradient(135deg,var(--a1),var(--a2));
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden}
/* aurora */
body::before{content:"";position:fixed;inset:-20%;z-index:-1;
  background:radial-gradient(40% 35% at 15% 10%,rgba(139,123,255,.22),transparent 70%),
             radial-gradient(35% 30% at 90% 20%,rgba(79,209,255,.16),transparent 70%),
             radial-gradient(40% 40% at 60% 100%,rgba(255,122,198,.12),transparent 70%);
  filter:blur(20px);animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.05)}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:9px;border:3px solid transparent;background-clip:padding-box}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}
/* sidebar */
aside{background:var(--glass);backdrop-filter:blur(18px);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;font-weight:700;letter-spacing:.2px}
.orb{width:28px;height:28px;border-radius:50%;background:var(--grad);box-shadow:0 0 18px rgba(139,123,255,.6);flex:none}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.newbtn{margin:4px 14px 10px;padding:11px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--glass2);
  display:flex;align-items:center;gap:8px;font-weight:600;transition:.2s}
.newbtn:hover{border-color:var(--a1);box-shadow:0 0 0 3px rgba(139,123,255,.15)}
.search{margin:0 14px 8px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);outline:none}
.chats{overflow:auto;padding:4px 8px 12px;flex:1}
.grp{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin:14px 10px 6px}
.ci{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;color:#c8ccd8;cursor:pointer;font-size:14px}
.ci span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci:hover{background:rgba(255,255,255,.04)}
.ci.on{background:linear-gradient(90deg,rgba(139,123,255,.18),rgba(79,209,255,.06));color:#fff}
.ci .x{opacity:0;border:none;background:none;color:var(--muted);padding:0 4px}
.ci:hover .x{opacity:1}.ci .x:hover{color:var(--bad)}
.foot{padding:12px 16px;border-top:1px solid var(--line);font-size:13px;display:flex;gap:14px}
.foot a{color:var(--muted);text-decoration:none}.foot a:hover{color:var(--fg)}
/* main */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line);background:rgba(10,11,16,.4);backdrop-filter:blur(12px)}
.title{font-weight:600;background:none;border:1px solid transparent;border-radius:8px;padding:5px 8px;min-width:120px;max-width:340px;outline:none}
.title:focus{border-color:var(--line2)}
.pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--glass2);font-size:13px}
.pill select{background:transparent;border:none;outline:none;max-width:190px}
.pill select option{background:#151722}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:6px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;user-select:none}
.tog.on{color:#fff;border-color:rgba(139,123,255,.6);background:rgba(139,123,255,.14)}
.sp{flex:1}
.scroll{flex:1;overflow:auto;scroll-behavior:smooth}
.thread{max-width:860px;margin:0 auto;padding:28px 24px 40px}
.msg{display:flex;gap:14px;margin:0 0 26px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:linear-gradient(135deg,rgba(139,123,255,.28),rgba(79,209,255,.18));border:1px solid rgba(139,123,255,.35);
  padding:11px 16px;border-radius:18px 18px 4px 18px;max-width:78%;white-space:pre-wrap}
.av{width:30px;height:30px;border-radius:50%;flex:none;background:var(--grad);display:grid;place-items:center;font-size:13px;font-weight:700;color:#0a0b10;margin-top:2px}
.body{min-width:0;flex:1}
.md{overflow-wrap:anywhere}
.md p{margin:.35em 0 .7em}.md ul,.md ol{padding-left:1.4em}.md li{margin:.2em 0}
.md h1,.md h2,.md h3{margin:1em 0 .4em;line-height:1.3}.md h1{font-size:1.35em}.md h2{font-size:1.2em}.md h3{font-size:1.05em}
.md a{color:var(--a2)}.md blockquote{margin:.6em 0;padding:.2em 1em;border-left:3px solid var(--a1);color:#c9cde0;background:rgba(139,123,255,.06);border-radius:0 8px 8px 0}
.md code{font-family:"JetBrains Mono",Consolas,monospace;font-size:.88em;background:rgba(255,255,255,.07);padding:.12em .4em;border-radius:6px}
.md pre{position:relative;background:#0d0f16!important;border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:auto}
.md pre code{background:none;padding:0;font-size:13px;line-height:1.55}
.md table{border-collapse:collapse;margin:.6em 0}.md th,.md td{border:1px solid var(--line2);padding:6px 10px}
.copy{position:absolute;top:8px;right:8px;font-size:12px;padding:3px 9px;border-radius:7px;border:1px solid var(--line2);background:#1a1d28;color:var(--muted)}
.copy:hover{color:#fff}
.meta{display:flex;gap:12px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted);opacity:0;transition:.2s}
.msg:hover .meta,.msg.last .meta{opacity:1}
.meta button{background:none;border:none;color:var(--muted);padding:0}.meta button:hover{color:#fff}
.chip{display:inline-flex;align-items:center;gap:8px;margin:2px 0 10px;padding:6px 12px;border-radius:10px;font-size:13px;
  background:rgba(79,209,255,.07);border:1px solid rgba(79,209,255,.22);color:#bfeeff;cursor:pointer;max-width:100%}
.chip pre{display:none;margin:6px 0 0;white-space:pre-wrap;font-size:12px;color:var(--muted);font-family:"JetBrains Mono",monospace}
.chip.open{display:block}.chip.open pre{display:block}
.think{margin:0 0 10px;font-size:13px;color:var(--muted);border-left:2px solid var(--line2);padding-left:10px;white-space:pre-wrap;max-height:180px;overflow:auto}
.card{border:1px solid rgba(255,190,92,.4);background:linear-gradient(135deg,rgba(255,190,92,.08),rgba(255,122,198,.05));border-radius:14px;padding:14px 16px;margin:4px 0 10px}
.card h4{margin:0 0 6px;font-size:14px;color:var(--warn)}
.card .kv{font-size:13px;color:#d6d9e6;margin:3px 0}.card .kv b{color:var(--muted);font-weight:500;margin-right:6px}
.card .btns{display:flex;gap:8px;margin-top:10px}
.btn{padding:8px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--glass2);font-weight:600}
.btn.go{background:var(--grad);border:none;color:#0a0b10}
.caret{display:inline-block;width:8px;height:1.1em;vertical-align:-3px;background:var(--a2);border-radius:2px;animation:blink 1s steps(2) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.typing{display:flex;gap:5px;padding:8px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--a1);animation:bob 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s;background:#6fa8ff}.typing i:nth-child(3){animation-delay:.3s;background:var(--a2)}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}
/* empty */
.hero{max-width:760px;margin:12vh auto 0;padding:0 24px;text-align:center}
.hero .big{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:var(--grad);box-shadow:0 0 50px rgba(139,123,255,.55);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 80px rgba(79,209,255,.55);transform:scale(1.04)}}
.hero h1{font-size:30px;margin:0 0 6px;background:linear-gradient(90deg,#fff,#c9c3ff 50%,#9fe6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:0 0 26px}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.sug{padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:var(--glass2);cursor:pointer;font-size:14px;transition:.2s}
.sug:hover{border-color:rgba(139,123,255,.5);transform:translateY(-1px)}
.sug b{display:block;font-size:13px;margin-bottom:2px}.sug span{color:var(--muted);font-size:13px}
/* composer */
.compose{padding:10px 24px 22px}
.box{max-width:860px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 18px;border-radius:20px;
  background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line2);box-shadow:0 10px 40px rgba(0,0,0,.35);transition:.2s}
.box:focus-within{border-color:rgba(139,123,255,.55);box-shadow:0 10px 40px rgba(0,0,0,.35),0 0 0 4px rgba(139,123,255,.12)}
.box textarea{flex:1;resize:none;border:none;outline:none;background:transparent;max-height:220px;min-height:26px;padding:6px 0;line-height:1.5}
.send{width:40px;height:40px;border-radius:12px;border:none;background:var(--grad);color:#0a0b10;font-size:18px;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.35;cursor:default}
.send.stop{background:#2a2d3a;color:#fff}
.hint{max-width:860px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--muted)}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{display:none}.sugs{grid-template-columns:1fr}.top{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="orb"></div><div>Daybook Chat<small>local · private</small></div></div>
    <button class="newbtn" onclick="newChat()">＋ New chat</button>
    <input class="search" id="search" placeholder="Search chats" oninput="renderList()">
    <div class="chats" id="chats"></div>
    <div class="foot"><a href="/">← Daybook</a><a href="/#notes">Notes</a><a href="/#rem">Reminders</a></div>
  </aside>
  <main>
    <div class="top">
      <input class="title" id="title" value="New chat" onchange="patch({title:this.value})">
      <div class="sp"></div>
      <label class="pill" title="Model"><span class="dot"></span><select id="model" onchange="patch({model:this.value})"></select></label>
      <label class="pill" title="Persona">✨<select id="persona" onchange="patch({persona:this.value})"></select></label>
      <span class="tog" id="t-daybook" onclick="toggle('daybook')" title="Let the AI use your reminders, schedule and notes">📅 Daybook</span>
      <span class="tog" id="t-orca" onclick="toggle('orca')" title="Let the AI create Orca projects / start coding agents (always asks first)">🛠 Orca</span>
    </div>
    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
    <div class="compose">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Message your local AI…"></textarea>
        <button class="send" id="send" onclick="sendOrStop()" title="Send (Enter)">↑</button>
      </div>
      <div class="hint" id="hint">Runs on your PC · Enter to send · Shift+Enter for a new line</div>
    </div>
  </main>
</div>
<script>
const $ = s => document.querySelector(s);
const api = async (u, o = {}) => { const r = await fetch(u, {headers: {"Content-Type": "application/json"}, ...o, body: o.body ? JSON.stringify(o.body) : undefined}); return r.json(); };
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
marked.setOptions({breaks: true, gfm: true});
const md = t => DOMPurify.sanitize(marked.parse(t || ""));
let MODELS = [], PERSONAS = [], CHATS = [], chat = null, streaming = false;

const TOOL_LABEL = {day_schedule: "📅 Checked your schedule", add_reminder: "⏰ Created a reminder", list_reminders: "⏰ Looked at reminders",
  search_notes: "🔎 Searched your notes", get_note: "📄 Read a note", add_note: "📝 Saved a note", log_to_today: "🗒 Logged to today",
  orca_list_projects: "🛠 Listed Orca projects", orca_new_project: "🛠 New Orca project", orca_start_task: "🛠 Orca task"};

async function boot() {
  const m = await api("/api/chat/models");
  MODELS = m.models; PERSONAS = m.personas;
  $("#model").innerHTML = MODELS.map(x => `<option value="${x.name}">${x.name}${x.params ? " · " + x.params : ""}${x.tools ? "" : " (no tools)"}</option>`).join("") || `<option>No models — is Ollama running?</option>`;
  $("#persona").innerHTML = PERSONAS.map(p => `<option>${p}</option>`).join("");
  await loadChats();
  const id = +location.hash.slice(1);
  if (id && CHATS.find(c => c.id === id)) openChat(id); else hero();
}
async function loadChats() { CHATS = await api("/api/chats"); renderList(); }
function renderList() {
  const q = $("#search").value.toLowerCase(), now = new Date(), day = 864e5;
  const groups = {Today: [], Yesterday: [], "Previous 7 days": [], Older: []};
  CHATS.filter(c => c.title.toLowerCase().includes(q)).forEach(c => {
    const age = (now - new Date(c.updated)) / day;
    const g = new Date(c.updated).toDateString() === now.toDateString() ? "Today" : age < 2 ? "Yesterday" : age < 7 ? "Previous 7 days" : "Older";
    groups[g].push(c);
  });
  $("#chats").innerHTML = Object.entries(groups).filter(([, v]) => v.length).map(([g, v]) => `<div class="grp">${g}</div>` +
    v.map(c => `<div class="ci ${chat && chat.id === c.id ? "on" : ""}" onclick="openChat(${c.id})"><span>${esc(c.title)}</span>
      <button class="x" title="Delete" onclick="event.stopPropagation();delChat(${c.id},this)">✕</button></div>`).join("")).join("")
    || `<div class="grp">No chats yet</div>`;
}
function hero() {
  chat = null; location.hash = ""; $("#title").value = "New chat";
  const h = new Date().getHours(), greet = h < 5 ? "You're up early" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  const sugs = [["📅 My day", "What's on my schedule tomorrow?"], ["🔎 My notes", "What did I write about Unleash U?"],
    ["🎬 Ori script", "Write a 30-second Ori script about discipline as a spiritual practice"],
    ["🛠 New project", "Start a new project: a simple habit tracker web app"]];
  $("#thread").innerHTML = `<div class="hero"><div class="big"></div><h1>${greet}, Taylor</h1>
    <p>Private chat with your local models — it can see your schedule & notes and start projects in Orca.</p>
    <div class="sugs">${sugs.map(([b, s]) => `<div class="sug" onclick="startWith(this.dataset.s)" data-s="${esc(s)}"><b>${b}</b><span>${esc(s)}</span></div>`).join("")}</div></div>`;
  setToggles("daybook,orca"); renderList();
}
function newChat() { hero(); input.focus(); }  // the chat row is created on the first message
async function createChat() {
  chat = await api("/api/chats", {method: "POST", body: {model: $("#model").value, persona: $("#persona").value, tools: currentTools()}});
  location.hash = chat.id; await loadChats();
}
async function startWith(text) { $("#input").value = text; sendOrStop(); }
async function openChat(id) {
  const j = await api("/api/chats/" + id);
  chat = j.chat; location.hash = id;
  $("#title").value = chat.title; $("#model").value = chat.model; $("#persona").value = chat.persona; setToggles(chat.tools);
  renderMessages(j.messages); renderList();
}
async function delChat(id, btn) {
  if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = "Delete?"; btn.style.opacity = 1; btn.style.color = "var(--bad)"; return; }
  await api("/api/chats/" + id, {method: "DELETE"}); if (chat && chat.id === id) hero(); loadChats();
}
async function patch(b) { if (chat) { chat = await api("/api/chats/" + chat.id, {method: "PATCH", body: b}); loadChats(); } }
function currentTools() { return ["daybook", "orca"].filter(t => $("#t-" + t).classList.contains("on")).join(","); }
function setToggles(s) { ["daybook", "orca"].forEach(t => $("#t-" + t).classList.toggle("on", (s || "").split(",").includes(t))); }
function toggle(t) { $("#t-" + t).classList.toggle("on"); patch({tools: currentTools()}); }

// ---------- rendering ----------
function renderMessages(msgs) {
  const th = $("#thread"); th.innerHTML = "";
  const resolved = new Set(msgs.filter(m => m.meta.resolved).map(m => m.meta.resolved));
  let block = null;
  for (const m of msgs) {
    if (m.role === "user") { th.insertAdjacentHTML("beforeend", userHTML(m.content)); block = null; continue; }
    if (!block) block = aiBlock();
    if (m.role === "tool") block.parts.insertAdjacentHTML("beforeend", chipHTML(m.meta.name, m.meta.args, m.content));
    else if (m.role === "action") { if (!resolved.has(m.meta.pending)) block.parts.insertAdjacentHTML("beforeend", cardHTML(m.meta.pending, m.meta.name, m.meta.args)); }
    else if (m.content) { const d = document.createElement("div"); d.className = "md"; d.innerHTML = md(m.content); block.parts.appendChild(d); block.text = m.content; block.stats = m.meta.stats; }
  }
  decorate(); markLast(); scrollDown(true);
}
function userHTML(t) { return `<div class="msg user"><div class="bubble">${esc(t)}</div></div>`; }
function aiBlock() {
  const w = document.createElement("div"); w.className = "msg ai";
  w.innerHTML = `<div class="av">✦</div><div class="body"><div class="parts"></div><div class="meta"></div></div>`;
  $("#thread").appendChild(w);
  const b = {el: w, parts: w.querySelector(".parts"), meta: w.querySelector(".meta"), text: ""};
  w._b = b; return b;
}
function chipHTML(name, args, result) {
  return `<div class="chip" onclick="this.classList.toggle('open')">${TOOL_LABEL[name] || "🔧 " + name}
    <pre>${esc(JSON.stringify(args))}\n\n${esc(result || "")}</pre></div>`;
}
function cardHTML(id, name, a) {
  const what = name === "orca_new_project" ? "Create a new project in Orca" : "Start a coding agent in Orca";
  const rows = Object.entries(a).filter(([, v]) => v).map(([k, v]) => `<div class="kv"><b>${esc(k)}</b>${esc(v)}</div>`).join("");
  return `<div class="card" id="card-${id}"><h4>⚡ ${what}?</h4>${rows}
    <div class="btns"><button class="btn go" onclick="resolve('${id}',true)">Confirm</button><button class="btn" onclick="resolve('${id}',false)">Cancel</button></div></div>`;
}
async function resolve(id, approve) {
  const card = $("#card-" + id);
  card.querySelector(".btns").innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
  const r = await api("/api/actions/" + id, {method: "POST", body: {approve}});
  card.outerHTML = `<div class="md">${md((approve && !String(r.result).startsWith("Error") ? "✅ " : "") + (r.result || r.error))}</div>`;
}
function decorate(root = document) {
  root.querySelectorAll(".md pre code:not(.hljs)").forEach(c => {
    hljs.highlightElement(c);
    const b = document.createElement("button"); b.className = "copy"; b.textContent = "Copy";
    b.onclick = () => { navigator.clipboard.writeText(c.innerText); b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1200); };
    c.parentElement.appendChild(b);
  });
}
function markLast() {
  document.querySelectorAll(".msg.ai").forEach(m => m.classList.remove("last"));
  const all = document.querySelectorAll(".msg.ai"); const last = all[all.length - 1];
  all.forEach(m => { const b = m._b; if (!b) return;
    const s = b.stats && b.stats.eval_count && b.stats.eval_duration ? `${(b.stats.eval_count / (b.stats.eval_duration / 1e9)).toFixed(1)} tok/s` : "";
    b.meta.innerHTML = `<button onclick="copyText(this)">Copy</button>${m === last ? `<button onclick="regen()">↻ Regenerate</button>` : ""}<span>${s}</span>`; });
  if (last) last.classList.add("last");
}
function copyText(btn) { const b = btn.closest(".msg")._b; navigator.clipboard.writeText(b.text); btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy", 1200); }
let pinned = true;
$("#scroll").addEventListener("scroll", e => { const s = e.target; pinned = s.scrollHeight - s.scrollTop - s.clientHeight < 80; });
function scrollDown(force) { const s = $("#scroll"); if (force || pinned) s.scrollTop = s.scrollHeight; }

// ---------- sending / streaming ----------
const input = $("#input");
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 220) + "px"; });
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendOrStop(); } });
async function sendOrStop() {
  if (streaming) { if (chat) api(`/api/chats/${chat.id}/stop`, {method: "POST"}); return; }
  const text = input.value.trim(); if (!text) return;
  if (!chat) { await createChat(); $("#thread").innerHTML = ""; }
  input.value = ""; input.style.height = "auto";
  $("#thread").insertAdjacentHTML("beforeend", userHTML(text)); scrollDown(true);
  stream(`/api/chats/${chat.id}/send`, {content: text});
}
async function regen() {
  const all = document.querySelectorAll(".msg.ai"); const last = all[all.length - 1];
  if (last) last.remove();
  stream(`/api/chats/${chat.id}/regenerate`, {});
}
async function stream(url, body) {
  streaming = true; $("#send").classList.add("stop"); $("#send").textContent = "■";
  const b = aiBlock(); let cur = null, thinkEl = null, raw = "";
  b.parts.innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
  const clearTyping = () => { const t = b.parts.querySelector(".typing"); if (t) t.remove(); };
  try {
    const res = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (chunk.match(/^event: (.*)$/m) || [])[1], data = JSON.parse((chunk.match(/^data: (.*)$/m) || [, "{}"])[1]);
        if (ev === "token") {
          clearTyping();
          if (!cur) { cur = document.createElement("div"); cur.className = "md"; b.parts.appendChild(cur); raw = ""; }
          raw += data.t; b.text = raw; cur.innerHTML = md(raw) + `<span class="caret"></span>`;
        } else if (ev === "think") {
          clearTyping();
          if (!thinkEl) { thinkEl = document.createElement("div"); thinkEl.className = "think"; b.parts.appendChild(thinkEl); }
          thinkEl.textContent += data.t;
        } else if (ev === "tool") {
          clearTyping(); if (cur) { cur.innerHTML = md(raw); cur = null; }
          b.parts.insertAdjacentHTML("beforeend", `<div class="chip" data-pending="1">${TOOL_LABEL[data.name] || "🔧 " + data.name}…</div>`);
        } else if (ev === "tool_result") {
          const p = b.parts.querySelector('.chip[data-pending="1"]');
          if (p) p.outerHTML = chipHTML(data.name, {}, data.result);
          b.parts.insertAdjacentHTML("beforeend", `<div class="typing"><i></i><i></i><i></i></div>`);
        } else if (ev === "confirm") {
          clearTyping(); if (cur) { cur.innerHTML = md(raw); cur = null; }
          b.parts.insertAdjacentHTML("beforeend", cardHTML(data.id, data.name, data.args));
        } else if (ev === "error") {
          clearTyping(); b.parts.insertAdjacentHTML("beforeend", `<div class="md" style="color:var(--bad)">⚠ ${esc(data.message)}</div>`);
        } else if (ev === "done") { b.stats = data.stats; }
        scrollDown();
      }
    }
  } catch (e) { b.parts.insertAdjacentHTML("beforeend", `<div class="md" style="color:var(--bad)">⚠ ${esc(e.message)}</div>`); }
  clearTyping(); if (cur) cur.innerHTML = md(raw);
  decorate(b.el); markLast();
  streaming = false; $("#send").classList.remove("stop"); $("#send").textContent = "↑";
  setTimeout(loadChats, 2500); // pick up the auto-title
  input.focus();
}
boot();
</script>
</body>
</html>
